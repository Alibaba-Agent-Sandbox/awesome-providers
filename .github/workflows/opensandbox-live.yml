name: OpenSandbox live integration

on:
  pull_request:
    paths:
      - 'opensandbox/**'
      - '.github/workflows/opensandbox-live.yml'
  push:
    branches: [main]
    paths:
      - 'opensandbox/**'
      - '.github/workflows/opensandbox-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: OpenSandbox Docker + CLI + Python SDK (T4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OSB_WORKDIR: /tmp/abx-opensandbox-ci
      OSB_WITH_EGRESS: '0'
      OSB_EXECD_IMAGE: opensandbox/execd@sha256:cda2bc35409bbf57561599b316cafb899598f7dce671332e7ceda14eb1cfeded
      ABX_OPENSANDBOX_BASE_URL: http://127.0.0.1:8080
      ABX_OPENSANDBOX_API_KEY: local-dev-key
      OPENSANDBOX_API_KEY: local-dev-key
      OPENSANDBOX_LIVE: '1'
      ABX_LAUNCH_TEMPLATE_SOURCE: /tmp/abx-templates/python-hello
      ABX_LAUNCH_NODE_CLIENT: file:///tmp/abx-node/dist/index.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch reviewed host sources
        run: |
          git clone https://github.com/Alibaba-Agent-Sandbox/agent-sandbox.git /tmp/abx-cli
          git -C /tmp/abx-cli checkout 6dfdf9897ad76bf2fdb7eb1ccf455252b2dcb9fb
          git clone https://github.com/Alibaba-Agent-Sandbox/awesome-templates.git /tmp/abx-templates
          git -C /tmp/abx-templates checkout 26d6e24e8b29b6c73b364d954dc0279d22a6f9d5
          git clone https://github.com/Alibaba-Agent-Sandbox/python-sdk.git /tmp/abx-python
          git -C /tmp/abx-python checkout 2ad2a482571bc030a7be298217cf7956bd164da4
          git clone https://github.com/Alibaba-Agent-Sandbox/nodejs-sdk.git /tmp/abx-node
          git -C /tmp/abx-node checkout 63d7cd8ece221b9f968eef51eeb932ea334c90d3
      - name: Install locked CLI and matching SDK packages
        run: |
          npm ci --prefix /tmp/abx-cli
          npm run build --prefix /tmp/abx-cli
          npm ci --prefix /tmp/abx-node
          npm run build --prefix /tmp/abx-node
          # Exact candidate pair for the readiness regression; public-package acceptance follows publication.
          python -m pip install --index-url https://pypi.org/simple /tmp/abx-python/server-sdk /tmp/abx-python/client-sdk pytest pytest-asyncio
          echo "ABX_BIN=/tmp/abx-cli/bin/abx" >> "$GITHUB_ENV"
          mkdir -p /tmp/abx-cli/bin
          printf '#!/bin/sh\nexec node /tmp/abx-cli/dist/bin/abx.js "$@"\n' > /tmp/abx-cli/bin/abx
          chmod +x /tmp/abx-cli/bin/abx
          echo "ABX_OPENSANDBOX_PLUGIN=$GITHUB_WORKSPACE/opensandbox" >> "$GITHUB_ENV"
      - name: Project parser with actual host staging and pinned official SDK
        run: E2B_TEMPLATE_SDK_MODULE="file:///tmp/abx-cli/node_modules/e2b/dist/index.mjs" ABX_PROJECT_HELPER_MODULE="file:///tmp/abx-cli/dist/providers/shared/project.js" node --test tests/project-sdk.test.mjs
      - name: Verify SDK fixture and CLI share an isolated home
        run: python -m pytest -q opensandbox/tests/harness --confcutdir=opensandbox/tests/harness
      - name: Start real Docker-backed OpenSandbox
        run: |
          docker info >/dev/null
          bash /tmp/abx-python/e2e/opensandbox/local-up.sh up
      - name: Run direct plugin, installed contract kit and environment tests
        run: python /tmp/abx-python/e2e/opensandbox/provider_e2e.py --stages node-unit,node-live,install,kit,env
      - name: Run Python SDK scenarios with streamed diagnostics
        timeout-minutes: 8
        run: |
          task_home=$(mktemp -d)
          export HOME="$task_home"
          cd "$task_home"
          python -m pytest -vv -s -o faulthandler_timeout=60 -p no:cacheprovider --rootdir "$task_home" --confcutdir "$GITHUB_WORKSPACE/opensandbox" "$GITHUB_WORKSPACE/opensandbox/tests/contract"
      - name: Run CLI lifecycle, commands and files
        run: bash /tmp/abx-cli/e2e/providers/run.sh opensandbox
      - name: Run native project build, registry push and automatic launch
        run: |
          docker run -d --name abx-project-registry -p 5000:5000 registry:2.8.3
          ABX_LAUNCH_PROXY_PROBE=1 node opensandbox/tests/project-launch.mjs
          ABX_LAUNCH_BUILD_PROFILE=portable node opensandbox/tests/project-launch.mjs
          ABX_OPENSANDBOX_USE_SERVER_PROXY=true ABX_LAUNCH_PROXY_PROBE=1 node opensandbox/tests/project-launch.mjs
      - name: Cleanup and verify no sandbox containers remain
        if: always()
        run: |
          if [ -f /tmp/abx-python/e2e/opensandbox/local-up.sh ]; then
            bash /tmp/abx-python/e2e/opensandbox/local-up.sh down
          fi
          docker rm -f abx-project-registry >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter name=sandbox-)"
