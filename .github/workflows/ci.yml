name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  projects:
    name: Provider project preparation (T0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/project.test.mjs tests/workflow-operations.test.mjs
  cubesandbox:
    name: CubeSandbox image adapter (T0, native API loopback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native API contract and failure/privacy regressions
        working-directory: cubesandbox
        run: node tests/run.mjs
  e2b:
    name: E2B image adapter (T0, official SDK with loopback backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned official SDK without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/e2b-sdk" --ignore-scripts --no-audit --no-fund e2b@2.55.0
      - name: Unit and official SDK protocol tests (no cloud credentials)
        working-directory: e2b
        run: E2B_TEMPLATE_SDK_MODULE="file://$RUNNER_TEMP/e2b-sdk/node_modules/e2b/dist/index.mjs" node tests/run.mjs
  opensandbox:
    name: OpenSandbox plugin (T0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opensandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit and mock tests
        run: node tests/run.mjs
