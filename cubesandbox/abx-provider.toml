manifest_version = 1

[provider]
id = "cubesandbox"
name = "CubeSandbox"
name_zh = "CubeSandbox"
version = "0.1.0"
description = "Tencent CubeSandbox CubeAPI. Default http://127.0.0.1:3000."
license = "Apache-2.0"

[compat]
protocol = "python/1"
requires = { sdk = ">=0.3" }

[runtime]
kind = "python"
entry = "provider.py"

[features]
supported = [
  "sandbox.lifecycle", "sandbox.timeout", "sandbox.pause",
  "exec.run", "exec.stream", "files.rw", "files.watch", "code.interpret", "ports.url",
]

[security]
network = ["*"]
