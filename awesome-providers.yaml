# Agent Sandbox provider plugins
#
# A curated index of installable sandbox providers. One directory per provider.
# The SDK and the CLI do not ship these plugins; install one with:
#
#   abx provider install alibaba-agent-sandbox/awesome-providers//<path>
#
# Schema (schema_version 1):
#   schema_version: 1
#   providers:
#     - name:         provider id (matches abx-provider.toml [provider].id)
#       description:  one line
#       repo:         GitHub repository URL
#       path:         directory inside this repo (omit only if the whole repo is one plugin)
#       tags:         search tags
#       author:       author name or GitHub handle
#       kind:         node | exec | rest
#       license:      SPDX identifier
#       status:       official | community | experimental (maintainer origin)
#       maturity:     stable | beta (acceptance; absent means beta)
#
# Add a provider by creating a directory and a matching entry, then opening a PR.

schema_version: 1
providers:
  - name: opensandbox
    description: "OpenSandbox server (Docker or Kubernetes) through a dependency-free Node ES module"
    repo: https://github.com/alibaba-agent-sandbox/awesome-providers
    path: opensandbox
    tags: [opensandbox, node]
    author: alibaba-agent-sandbox
    kind: node
    license: Apache-2.0
    status: official
    maturity: beta

  - name: cubesandbox
    description: "Tencent CubeSandbox CubeAPI. Default http://127.0.0.1:3000."
    repo: https://github.com/alibaba-agent-sandbox/awesome-providers
    path: cubesandbox
    tags: [cubesandbox, node]
    author: alibaba-agent-sandbox
    kind: node
    license: Apache-2.0
    status: official
    maturity: beta
  - name: e2b
    description: "E2B public API. Set ABX_E2B_API_KEY. Does not read the Express key."
    repo: https://github.com/alibaba-agent-sandbox/awesome-providers
    path: e2b
    tags: [e2b, node]
    author: alibaba-agent-sandbox
    kind: node
    license: Apache-2.0
    status: official
    maturity: beta
  - name: alicloud-container
    description: "ACS/ACK sandbox-manager. Set ABX_ALICLOUD_CONTAINER_DOMAIN and ABX_ALICLOUD_CONTAINER_API_KEY."
    repo: https://github.com/alibaba-agent-sandbox/awesome-providers
    path: alicloud-container
    tags: [alicloud, container, node]
    author: alibaba-agent-sandbox
    kind: node
    license: Apache-2.0
    status: official
    maturity: beta
