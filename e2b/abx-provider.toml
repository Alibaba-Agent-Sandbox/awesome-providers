manifest_version = 1

[provider]
id = "e2b"
name = "E2B"
name_zh = "E2B"
version = "0.1.0"
description = "E2B cloud sandboxes. Set ABX_E2B_API_KEY. Does not read the Express key."
license = "Apache-2.0"

[compat]
protocol = "python/1"
requires = { sdk = ">=0.3" }

[runtime]
kind = "python"
entry = "provider.py"

[features]
supported = [
  "sandbox.lifecycle", "sandbox.timeout", "sandbox.pause",
  "exec.run", "exec.stream", "process.manage", "files.rw", "files.watch",
  "code.interpret", "ports.url",
]

[security]
network = ["api.e2b.app", "e2b.app"]
