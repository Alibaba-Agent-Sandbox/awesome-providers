manifest_version = 1

[provider]
id          = "alicloud-container"
name        = "Alibaba Cloud Agent Sandbox Container Edition"
name_zh     = "阿里云智能体沙箱容器版"
version     = "0.3.0"
description = "ACS/ACK sandbox-manager. Set ABX_ALICLOUD_CONTAINER_DOMAIN and ABX_ALICLOUD_CONTAINER_API_KEY."
license     = "Apache-2.0"

[compat]
protocol = "node/1"
requires = { sdk = ">=0.3", cli = ">=0.3" }

[runtime]
kind  = "node"
entry = "provider.mjs"

[features]
supported = [
  "templates.build", "sandbox.lifecycle", "sandbox.timeout", "sandbox.pause",
  "exec.run", "exec.stream", "process.manage", "files.rw", "code.interpret", "ports.url",
]

[security]
spawns_processes = true
network = ["*"]

[core]
inherit = []

[config.fields.domain]
type           = "string"
description    = "sandbox-manager domain. Native API is https://api.{domain}."
description_zh = "sandbox-manager 域名。原生协议的 API 是 https://api.{domain}。"

[config.fields.base_url]
type           = "url"
description    = "Override the API origin. Private protocol is https://{domain}/kruise/api."
description_zh = "覆盖 API 源站。私有协议是 https://{domain}/kruise/api。"

[config.fields.api_key]
type           = "string"
secret         = true
credential     = true
description    = "sandbox-manager API key, sent as X-API-Key."
description_zh = "sandbox-manager 的 API Key，放在 X-API-Key。"

[config.fields.protocol]
type           = "enum"
choices        = ["native", "private"]
default        = "native"
description    = "native uses {port}-{id}.{domain}. private uses /kruise/{id}/{port}."
description_zh = "native 用 {port}-{id}.{domain}。private 用 /kruise/{id}/{port}。"

[auth]
any_of = [["api_key"]]

[config.fields.build_base_image]
type = "string"
description = "Native runtime base image used to replace the project's first FROM. Configure once for unresolved template placeholders. Must provide this backend's envd/code runtime when required."
description_zh = "替换项目首个 FROM 的原生运行时基础镜像。模板含占位符时配置一次；需包含该后端要求的 envd/代码运行时。"

[config.fields.image_repository]
type = "string"
description = "Writable OCI registry/repository without a tag. Project launch builds/pushes immutable tags with the existing Docker login."
description_zh = "可写 OCI 仓库/镜像路径，不带标签。项目启动使用已有 Docker 登录构建并推送不可变标签。"

[config.fields.kube_namespace]
type = "string"
description = "Kubernetes namespace for preparation; must match the sandbox-manager API-key namespace."
description_zh = "构建登记使用的 Kubernetes 命名空间，须与 sandbox-manager API Key 所属命名空间一致。"
[config.fields.kube_context]
type = "string"
description = "Optional explicit kubectl context for preparation."
description_zh = "准备模板时可选的 kubectl 上下文。"
[config.fields.build_template]
type = "string"
default = "code-interpreter"
description = "Existing base SandboxSet to clone, preserving runtime injection and probes."
description_zh = "克隆的基础 SandboxSet 名称，保留运行时注入和探针。"
[config.fields.build_container]
type = "string"
description = "Main container name when the base SandboxSet contains multiple containers."
description_zh = "基础 SandboxSet 有多个容器时指定主容器名称。"
